<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09111c" />
    <title>Deception RTS</title>
    <link data-trunk rel="rust" href="crates/rts-app/Cargo.toml" data-bin="rts-app" data-wasm-opt="0" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #09111c; }
      #game-canvas { width: 100% !important; height: 100% !important; display: block; }
      .hud { position: fixed; z-index: 2; top: 24px; left: 28px; pointer-events: none; }
      h1 { margin: 0; letter-spacing: .16em; text-transform: uppercase; font-size: clamp(24px, 4vw, 46px); }
      p { margin: 8px 0 0; color: #f0bc63; font: 600 13px ui-monospace, monospace; letter-spacing: .08em; }
      p.ready { color: #8ee59b; }
      .help { position: fixed; z-index: 2; right: 24px; bottom: 20px; color: #b8c3cf; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>Deception RTS</h1>
      <p id="boot-status">作戦システム: INITIALIZING</p>
    </div>
    <div class="help">WASD / 矢印: 移動 · ホイール: ズーム</div>
    <canvas id="game-canvas"></canvas>
  </body>
</html>
