[workspace]
resolver = "2"
members = ["crates/rts-core", "crates/rts-app"]
default-members = ["crates/rts-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "bevy_winit", "default_font", "multi_threaded", "std", "webgl2"] }
proptest = "=1.7.0"
wasm-bindgen = "=0.2.108"
web-sys = "=0.3.85"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
